name: Bug report
description: 报告可复现的功能问题
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请说明实际结果与期望结果。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请提供最小、可公开的复现步骤。
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python 版本
      placeholder: "例如 3.11.9"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 操作系统
      placeholder: "例如 macOS 15"
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 安全确认
      options:
        - label: 我没有提交密码、令牌、私有链接或个人数据。
          required: true

